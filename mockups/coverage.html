<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EmCare Coverage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Tokens and shell copied from frontend/src/index.css so the mockup matches the app. */
:root {
  --bg: #fdf4f1; --surface: #ffffff; --glass: rgba(255, 255, 255, 0.72);
  --text: #2b2330; --muted: #7d7280; --border: #f0e2e0;
  --accent: #ef7a5c; --accent-soft: #fde5dd; --accent-text: #c9772e;
  --violet: #6f5bd3; --violet-soft: #ece8fb; --logo: #b2392d; --ink: #2b2330;
  --tile: #fbeeee; --ok: #2e7d5b; --ok-soft: #e3f2ea; --warn: #b4561c; --warn-soft: #fdebd9;
  --serif: 'Fraunces', Georgia, serif;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text); background: var(--bg);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background:
    radial-gradient(60% 50% at 20% 25%, #fde3dc 0%, transparent 70%),
    radial-gradient(50% 45% at 85% 30%, #fbe1e6 0%, transparent 70%),
    var(--bg);
}
.muted { color: var(--muted); }
.small { font-size: 0.75rem; }
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: 12px 40px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.logo { font-family: var(--serif); font-size: 1.6rem; color: var(--logo); letter-spacing: -0.01em; }
.logo.small { font-size: 1rem; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--glass); border: 1px solid var(--border); }
.tab { padding: 7px 16px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; color: var(--muted); text-decoration: none; white-space: nowrap; }
.tab.active { background: #f1e6e6; color: var(--text); }
.profile-chip { justify-self: end; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--border); }
.persona { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 600; }
.persona select { font: inherit; border: none; background: transparent; font-weight: 600; padding: 2px 0; cursor: pointer; }
.avatar-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--logo); color: #fff; }
.page { flex: 1; width: 100%; max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
.site-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 20px 40px; font-size: 0.75rem; color: var(--muted); border-top: 1px solid var(--border); background: rgba(255, 255, 255, 0.5); }

.home { display: flex; flex-direction: column; align-items: center; }
.status-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--border); font-size: 0.75rem; font-weight: 600; }
.pill.small { padding: 4px 10px; font-size: 0.7rem; }
.pill .dot { width: 8px; height: 8px; }
.greeting { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 5vw, 2.6rem); margin: 20px 0 4px; text-align: center; letter-spacing: -0.01em; }
.quote { font-family: var(--serif); font-style: italic; color: var(--muted); margin: 0 0 24px; text-align: center; }

.ask { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 8px 30px rgba(178, 57, 45, 0.06); }
.ask input { flex: 1; min-width: 80px; border: none; outline: none; font: inherit; font-size: 0.9rem; background: transparent; }
.ask-mic, .ask-send { flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center; color: #fff; }
.ask-mic { background: var(--accent); }
.ask-send { background: var(--ink); }
.chips-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; max-width: 640px; }
.chip { font: inherit; font-size: 0.72rem; font-weight: 600; white-space: nowrap; cursor: pointer; padding: 5px 10px; border-radius: 999px; border: none; background: #f4ecec; color: var(--muted); }
.chip:hover { color: var(--text); }

.cards { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 28px; }
.span-2 { grid-column: 1 / -1; }
.glass { background: var(--glass); backdrop-filter: blur(10px); border-radius: 24px; padding: 22px; box-shadow: 0 12px 40px rgba(178, 57, 45, 0.06); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.card-head h2 { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; margin: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.coral { background: var(--accent); }
.dot.violet { background: var(--violet); }
.dot.green { background: var(--ok); }
.eyebrow { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--tile); }
.item.warn { background: var(--warn-soft); }
.icon { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--accent); }
.icon.violet { color: var(--violet); background: var(--violet-soft); }
.icon.green { color: var(--ok); background: var(--ok-soft); }
.item-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item-text strong { font-size: 0.95rem; }
.item-text .muted { font-size: 0.75rem; }
.price { flex: none; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.price b { font-size: 1.05rem; }
.price .why { font-size: 0.68rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.price.free b { color: var(--ok); }
.tag { font-size: 0.68rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #fff; white-space: nowrap; }
.tag.green { background: var(--ok-soft); color: var(--ok); }
.tag.violet { background: var(--violet-soft); color: var(--violet); }
.tag.warn { background: #fff; color: var(--warn); }
.foot-note { margin: 14px 0 0; font-size: 0.72rem; color: var(--muted); }

/* Plan strip */
.plan { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.plan-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
.plan-badge { flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--logo); }
.plan-name { font-family: var(--serif); font-size: 1.35rem; margin: 2px 0; }
.plan-facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.75rem; color: var(--muted); }
.plan-facts b { color: var(--text); font-weight: 600; }
.plan-side { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn-dark { display: inline-flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; border-radius: 999px; border: none; background: var(--ink); color: #fff; font: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn-dark-icon { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); }

/* Money */
.big { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
.year-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.compare { font-size: 0.75rem; color: var(--muted); }
.years { display: flex; gap: 8px; margin: 12px 0 14px; }
.year { flex: 1; padding: 10px; border-radius: 12px; background: var(--tile); display: flex; flex-direction: column; gap: 6px; }
.year.on { background: #fff; box-shadow: inset 0 0 0 1.5px var(--accent-soft); }
.year .yb { height: 6px; border-radius: 999px; background: #f1e3e1; overflow: hidden; }
.year .yb span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.year b { font-size: 1rem; }
.breakdown { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; }
.breakdown li { display: flex; justify-content: space-between; gap: 12px; }
.breakdown li span:first-child { color: var(--muted); }
.meter { margin-top: 14px; }
.meter-top { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 6px; }
.meter-top b { font-weight: 600; }
.bar { height: 8px; border-radius: 999px; background: #f1e3e1; overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 999px; background: var(--violet); }
.bar.coral span { background: var(--accent); }
.bar.green span { background: var(--ok); }

.accounts { display: flex; flex-direction: column; gap: 12px; }
.account { padding: 14px; border-radius: 16px; background: var(--tile); }
.account-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.account h3 { margin: 0; font-size: 0.9rem; }
.account .left { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
.account .left small { font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-left: 4px; }
.account p { margin: 8px 0 0; font-size: 0.75rem; color: var(--muted); }
.account .bar { margin-top: 10px; }

.benefits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.benefit { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--tile); }
.benefit .item-text strong { font-size: 0.9rem; }
.benefit .tag { margin-top: 6px; align-self: flex-start; }

.shortcuts { display: flex; align-items: center; gap: 14px; margin-top: 36px; padding: 6px 6px 6px 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 0.8rem; font-weight: 600; }
.shortcuts .divider { width: 1px; height: 18px; background: var(--border); }
.shortcut { display: inline-flex; align-items: center; gap: 6px; }

.mock-banner { text-align: center; font-size: 0.72rem; font-weight: 600; padding: 6px; background: var(--violet-soft); color: var(--violet); }

@media (max-width: 860px) {
  .topbar { grid-template-columns: 1fr auto; padding: 10px 16px; }
  .tabs { grid-column: 1 / -1; grid-row: 2; justify-self: center; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .tab { padding: 7px 12px; font-size: 0.8rem; }
  .persona .muted { display: none; }
  .cards, .benefits { grid-template-columns: 1fr; }
  .site-footer { padding: 16px; }
}
@media (max-width: 520px) {
  .ask input { min-width: 0; }
  .price .why { white-space: normal; text-align: right; }
}
</style>
</head>
<body>
<div class="mock-banner">Mockup with sample data · Coverage screen</div>
<div class="shell">
  <header class="topbar">
    <span class="logo">EmCare</span>
    <nav class="tabs" aria-label="Main">
      <a class="tab" href="#">Home</a>
      <a class="tab" href="#">Doctor Buddy</a>
      <a class="tab active" href="#" aria-current="page">Coverage</a>
      <a class="tab" href="#">Wellness Synthesis</a>
    </nav>
    <div class="profile-chip">
      <label class="persona"><span class="muted">Viewing as</span>
        <select id="persona">
          <option value="jasmine">Jasmine, 34</option>
          <option value="maya">Maya, 27</option>
        </select>
      </label>
      <span class="avatar-btn" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>
    </div>
  </header>

  <main class="page"><div class="home" id="app"></div></main>

  <footer class="site-footer">
    <span><span class="logo small">EmCare</span> · Mindful Clinical Synthesis</span>
    <span>Costs are estimates from your plan. Your insurer has the final say.</span>
  </footer>
</div>

<script>
// Sample data. Insurers and employers are made up for the demo.
const ICONS = {
  calendar: 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4',
  shield: 'M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z M8.5 12l2.5 2.5 4.5-5',
  eye: 'M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z',
  tooth: 'M7 3c-2 0-3.5 1.7-3.5 4 0 3 1.5 5 2 8s1 6 2.5 6 1.7-3 2.5-5c.4-1 .8-1 1 0 .8 2 1 5 2.5 5s2-3 2.5-6 2-5 2-8c0-2.3-1.5-4-3.5-4-1.7 0-2.8 1-4 1S8.7 3 7 3Z',
  baby: 'M12 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z M6 21v-4a6 6 0 0 1 12 0v4',
  heart: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z',
  chat: 'M4 5h16v11H9l-5 4z',
  run: 'M13 4a1.5 1.5 0 1 0 3 0 1.5 1.5 0 0 0-3 0 M7 21l3-6 3 2v5 M10 15l1-5 4 2 3-1 M8 10l3-1',
  gift: 'M4 11h16v10H4z M3 7h18v4H3z M12 7v14 M12 7c-2 0-4-1-4-2.5S10 3 12 7c2-4 4-2.5 4-1S14 7 12 7Z',
  plane: 'M10 14l-6-2 1-2 7 1 4-6h2l-2 7 5 1 1 2-6 0-3 5h-2l1-5z',
  home: 'M4 11l8-7 8 7v9H4z M10 20v-5h4v5',
  arrow: 'M5 12h14 M13 6l6 6-6 6',
  mic: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z M5 11a7 7 0 0 0 14 0 M12 18v3',
  wallet: 'M4 7h15a1 1 0 0 1 1 1v11H4z M4 7l11-4v4 M16 13h2',
  pill: 'M10 4l10 10a4.2 4.2 0 0 1-6 6L4 10a4.2 4.2 0 0 1 6-6Z M7 13l6-6',
  globe: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Z M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18',
}
const icon = (n, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`
const money = (n) => '$' + n.toLocaleString('en-US')

const DATA = {
  jasmine: {
    plan: { name: 'Willowmere Family PPO', employer: 'Brightpath IT Services', member: 'WMH-4471-0921', group: '88213', covers: 'Jasmine and Leo', parts: ['Medical', 'Dental', 'Vision'] },
    upcoming: [
      { icon: 'calendar', title: 'Primary care visit', when: 'Today, 5:15 PM · Dr. Samuel Brooks', cost: 25, why: 'Office visit copay', fsa: true },
      { icon: 'heart', title: 'First OB visit', when: 'Fri Oct 30 · Dr. Elena Ortiz', cost: 0, why: 'Prenatal care is covered in full' },
      { icon: 'eye', title: 'Eye exam', when: 'Sat Nov 21 · Dr. Rosa Mendez', cost: 10, why: 'Vision plan copay', fsa: true },
    ],
    heads_up: { icon: 'baby', title: "Leo's new pediatrician", text: 'Dr. Aisha Grant is in network: $25. Dr. Kevin Liu is out of network: about $180.' },
    spend: { ytd: 1265, last: 2940, breakdown: [['Copays', 340], ['Deductible', 600], ['Coinsurance', 210], ['Prescriptions', 115]], premiums: 2160,
      deductible: { used: 600, total: 750 }, oop: { used: 1265, total: 4000 } },
    accounts: [
      { name: 'Health FSA', left: 860, total: 2000, color: 'coral', note: 'Use by Dec 31. You have until Mar 15 to spend what is left.', urgent: true, tag: 'Use it or lose it' },
      { name: 'Dependent care FSA', left: 2100, total: 5000, color: 'violet', note: "Pays for Leo's daycare at Little Oaks.", tag: 'Daycare' },
    ],
    benefits: [
      { icon: 'home', title: 'Paid parental leave', text: '12 weeks at full pay', status: 'Plan with HR', tone: 'violet' },
      { icon: 'heart', title: 'Doula support', text: 'Up to $1,500 back', status: 'Available', tone: 'green' },
      { icon: 'gift', title: 'Breast pump', text: 'Covered 100% by your plan', status: 'Available', tone: 'green' },
      { icon: 'chat', title: 'Free counseling', text: '6 sessions a year, private', status: '0 of 6 used', tone: '' },
      { icon: 'baby', title: 'Backup childcare', text: '10 days a year', status: '2 of 10 used', tone: '' },
    ],
    asks: ['Is my glucose screening covered?', 'How much FSA do I have left?', 'Which pediatricians are in network?'],
  },
  maya: {
    plan: { name: 'Willowmere Choice HSA Plan', employer: 'Halcyon Capital', member: 'WMH-2208-5560', group: '41077', covers: 'Maya', parts: ['Medical', 'Dental', 'Vision'] },
    upcoming: [
      { icon: 'tooth', title: 'Dental cleaning', when: 'Today, 6:00 PM · Dr. Priya Shah', cost: 0, why: 'Preventive dental is free' },
      { icon: 'eye', title: 'Eye exam', when: 'Wed Oct 28 · Dr. Marcus Lee', cost: 10, why: 'Vision plan copay', hsa: true },
      { icon: 'calendar', title: 'Dermatology visit', when: 'Sat Nov 14 · Dr. Hannah Cho', cost: 165, why: 'Deductible not met yet', hsa: true },
    ],
    heads_up: { icon: 'shield', title: 'Your annual physical is free', text: 'It is preventive care, so you pay $0. Your employer also adds $100 to your HSA when you go.' },
    spend: { ytd: 505, last: 1180, breakdown: [['Copays', 60], ['Deductible', 410], ['Coinsurance', 0], ['Prescriptions', 35]], premiums: 1080,
      deductible: { used: 410, total: 1700 }, oop: { used: 505, total: 4000 } },
    accounts: [
      { name: 'Health Savings Account (HSA)', left: 2340, total: null, color: 'green', note: 'Yours to keep. It rolls over every year. This year: you added $1,500 and Halcyon added $750, out of a $4,400 limit.', contrib: { used: 2250, total: 4400 }, tag: 'Rolls over' },
    ],
    benefits: [
      { icon: 'run', title: 'Fitness stipend', text: '$600 a year for races, gear, gyms', status: '$250 used', tone: '' },
      { icon: 'gift', title: 'Physical reward', text: '$100 into your HSA after your physical', status: 'Not earned yet', tone: 'violet' },
      { icon: 'chat', title: 'Free counseling', text: '6 sessions a year, private', status: '1 of 6 used', tone: '' },
      { icon: 'plane', title: 'Travel health line', text: '24/7 nurse line when you travel', status: 'Available', tone: 'green' },
    ],
    asks: ['Can I pay for dermatology with my HSA?', 'Is my physical free?', 'How much of my fitness stipend is left?'],
  },
}

/** Render the whole Coverage screen for one persona. */
function render(id) {
  const d = DATA[id]
  const pct = (a, b) => Math.min(100, Math.round((a / b) * 100))
  const s = d.spend
  const upcomingTotal = d.upcoming.reduce((t, u) => t + u.cost, 0)

  document.getElementById('app').innerHTML = `
    <div class="status-row">
      <span class="pill"><span class="dot green"></span> Coverage active</span>
      <span class="pill">Plan year 2026 · resets Jan 1</span>
    </div>
    <h1 class="greeting">Your coverage, made simple</h1>
    <p class="quote">What is covered, what you will pay, and money you can still use.</p>

    <form class="ask" onsubmit="return false">
      <button type="button" class="ask-mic" aria-label="Talk to Em">${icon('mic', 18)}</button>
      <input placeholder="Ask Em about your coverage..." aria-label="Ask Em" />
      <button type="submit" class="ask-send" aria-label="Send to Em">${icon('arrow')}</button>
    </form>
    <div class="chips-row">${d.asks.map((q) => `<button class="chip">${q}</button>`).join('')}</div>

    <div class="cards">
      <section class="card glass span-2 plan">
        <div class="plan-main">
          <span class="plan-badge">${icon('shield', 22)}</span>
          <div>
            <span class="eyebrow">My plan · through ${d.plan.employer}</span>
            <div class="plan-name">${d.plan.name}</div>
            <div class="plan-facts">
              <span>Member ID <b>${d.plan.member}</b></span>
              <span>Group <b>${d.plan.group}</b></span>
              <span>Covers <b>${d.plan.covers}</b></span>
            </div>
          </div>
        </div>
        <div class="plan-side">
          ${d.plan.parts.map((p) => `<span class="tag green">${p} ✓</span>`).join('')}
          <button class="btn-dark">ID card <span class="btn-dark-icon">${icon('arrow', 14)}</span></button>
        </div>
      </section>

      <section class="card glass">
        <header class="card-head">
          <h2><span class="dot coral"></span> Coming up: what you will pay</h2>
          <span class="eyebrow">${money(upcomingTotal)} total</span>
        </header>
        <ul class="list">
          ${d.upcoming.map((u) => `
            <li class="item">
              <span class="icon">${icon(u.icon)}</span>
              <div class="item-text">
                <strong>${u.title}</strong>
                <span class="muted">${u.when}</span>
              </div>
              <div class="price ${u.cost === 0 ? 'free' : ''}">
                <b>${u.cost === 0 ? '$0' : money(u.cost)}</b>
                <span class="why">${u.why}${u.fsa ? ' · FSA ok' : ''}${u.hsa ? ' · HSA ok' : ''}</span>
              </div>
            </li>`).join('')}
          <li class="item warn">
            <span class="icon">${icon(d.heads_up.icon)}</span>
            <div class="item-text">
              <strong>${d.heads_up.title}</strong>
              <span class="muted">${d.heads_up.text}</span>
            </div>
          </li>
        </ul>
        <p class="foot-note">Estimates from your plan. Final cost comes from your insurer.</p>
      </section>

      <section class="card glass">
        <header class="card-head">
          <h2><span class="dot violet"></span> What you have paid</h2>
          <span class="pill small">Out of pocket</span>
        </header>
        <div class="year-row">
          <span class="big">${money(s.ytd)}</span>
          <span class="compare">so far in 2026</span>
        </div>
        <div class="years">
          <div class="year on"><span class="eyebrow">2026 so far</span><b>${money(s.ytd)}</b><div class="yb"><span style="width:${pct(s.ytd, Math.max(s.ytd, s.last))}%"></span></div></div>
          <div class="year"><span class="eyebrow">2025</span><b>${money(s.last)}</b><div class="yb"><span style="width:${pct(s.last, Math.max(s.ytd, s.last))}%"></span></div></div>
        </div>
        <ul class="breakdown">
          ${s.breakdown.map(([k, v]) => `<li><span>${k}</span><b>${money(v)}</b></li>`).join('')}
        </ul>
        <div class="meter">
          <div class="meter-top"><b>Deductible</b><span class="muted">${money(s.deductible.used)} of ${money(s.deductible.total)}</span></div>
          <div class="bar coral"><span style="width:${pct(s.deductible.used, s.deductible.total)}%"></span></div>
        </div>
        <div class="meter">
          <div class="meter-top"><b>Out-of-pocket max</b><span class="muted">${money(s.oop.used)} of ${money(s.oop.total)}</span></div>
          <div class="bar"><span style="width:${pct(s.oop.used, s.oop.total)}%"></span></div>
        </div>
        <p class="foot-note">Plus ${money(s.premiums)} in premiums taken from your paycheck this year.</p>
      </section>

      <section class="card glass">
        <header class="card-head">
          <h2><span class="dot green"></span> Money you can use</h2>
          <span class="eyebrow">${d.accounts.length === 1 ? 'HSA' : 'FSA'}</span>
        </header>
        <div class="accounts">
          ${d.accounts.map((a) => `
            <div class="account">
              <div class="account-top">
                <h3>${a.name}</h3>
                <span class="tag ${a.urgent ? 'warn' : a.color === 'green' ? 'green' : 'violet'}">${a.tag}</span>
              </div>
              <div class="left">${money(a.left)}<small>${a.total ? `left of ${money(a.total)}` : 'balance'}</small></div>
              ${a.total ? `<div class="bar ${a.color}"><span style="width:${pct(a.total - a.left, a.total)}%"></span></div>` : ''}
              ${a.contrib ? `<div class="bar green"><span style="width:${pct(a.contrib.used, a.contrib.total)}%"></span></div>` : ''}
              <p>${a.note}</p>
            </div>`).join('')}
        </div>
      </section>

      <section class="card glass">
        <header class="card-head">
          <h2><span class="dot coral"></span> Perks from ${d.plan.employer}</h2>
          <span class="eyebrow">${d.benefits.length} benefits</span>
        </header>
        <ul class="list">
          ${d.benefits.map((b) => `
            <li class="item">
              <span class="icon ${b.tone || ''}">${icon(b.icon)}</span>
              <div class="item-text">
                <strong>${b.title}</strong>
                <span class="muted">${b.text}</span>
              </div>
              <span class="tag ${b.tone}">${b.status}</span>
            </li>`).join('')}
        </ul>
      </section>
    </div>

    <nav class="shortcuts" aria-label="Other sections">
      <span class="shortcut">${icon('chat')} Doctor Buddy</span>
      <span class="divider"></span>
      <span class="shortcut">${icon('globe')} Whole-Body Synthesis</span>
      <button class="ask-send" style="background:var(--accent)" aria-label="Talk to Em">${icon('arrow')}</button>
    </nav>`
}

const select = document.getElementById('persona')
select.addEventListener('change', () => render(select.value))
render(select.value)
</script>
</body>
</html>
